<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Profesional | NutriCalc</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .nav-active { background: #ecfdf5; color: #059669; border-right: 4px solid #10b981; }
        .dashboard-card { background: white; border-radius: 24px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); border: 1px solid rgba(226, 232, 240, 0.8); }
        .gizi-table { width: 100%; border-spacing: 0 8px; border-collapse: separate; }
        .gizi-table th { padding: 12px 16px; font-size: 11px; font-weight: 700; color: #64748b; text-transform: uppercase; letter-spacing: 0.1em; }
        .gizi-table td { padding: 12px 16px; background: white; border-top: 1px solid #f1f5f9; border-bottom: 1px solid #f1f5f9; }
        .gizi-table td:first-child { border-left: 1px solid #f1f5f9; border-radius: 12px 0 0 12px; }
        .gizi-table td:last-child { border-right: 1px solid #f1f5f9; border-radius: 0 12px 12px 0; }
        .table-input { width: 100%; background: #f8fafc; border: 1px solid #e2e8f0; padding: 8px 12px; border-radius: 10px; font-size: 13px; transition: all 0.2s; }
        .table-input:focus { background: white; border-color: #10b981; box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.1); outline: none; }
        .stat-box { padding: 20px; border-radius: 20px; background: white; border: 1px solid #e2e8f0; transition: transform 0.2s; }
        .hidden { display: none; }
        .pass-container { position: relative; }
        .pass-icon { position: absolute; right: 15px; top: 50%; transform: translateY(-50%); cursor: pointer; color: #94a3b8; }
        @media print { .no-print { display: none !important; } }
    </style>
</head>
<body class="flex min-h-screen text-slate-800">

    <aside class="w-64 bg-white border-r border-slate-200 hidden md:flex flex-col z-20 no-print">
        <div class="p-8 flex items-center gap-3">
            <div class="bg-emerald-600 p-2 rounded-xl">
                <svg width="24" height="24" viewBox="0 0 40 40" fill="none"><path d="M20 10V30M10 20H30" stroke="white" stroke-width="4" stroke-linecap="round"/></svg>
            </div>
            <span class="text-xl font-extrabold text-slate-800 tracking-tighter">NutriCalc</span>
        </div>
        <nav class="flex-grow px-4 space-y-1">
            <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest px-4 mb-4">Menu Utama</p>
            <a href="#" id="menu-kalkulator" onclick="window.switchTab('kalkulator')" class="nav-active flex items-center gap-3 px-4 py-3 rounded-xl font-bold transition-all"><i class="fas fa-calculator w-5"></i> Kalkulator</a>
            <a href="#" id="menu-riwayat" onclick="window.switchTab('riwayat')" class="flex items-center gap-3 px-4 py-3 rounded-xl text-slate-500 font-semibold hover:bg-slate-50 transition-all"><i class="fas fa-history w-5"></i> Riwayat</a>
            <a href="#" id="menu-profil" onclick="window.switchTab('profil')" class="flex items-center gap-3 px-4 py-3 rounded-xl text-slate-500 font-semibold hover:bg-slate-50 transition-all"><i class="fas fa-user-circle w-5"></i> Profil</a>
        </nav>
        <div class="p-6 border-t border-slate-100">
            <button onclick="window.logout()" class="w-full py-3 rounded-xl text-sm font-bold text-red-500 hover:bg-red-50 transition-all flex items-center justify-center gap-2"><i class="fas fa-sign-out-alt"></i> Keluar</button>
        </div>
    </aside>

    <main class="flex-grow p-6 md:p-10 overflow-y-auto">
        <div id="section-kalkulator" class="max-w-6xl mx-auto">
            <div class="flex flex-col md:flex-row justify-between items-end mb-8 gap-4">
                <div>
                    <h1 class="text-4xl font-extrabold text-slate-900 tracking-tight">Analisis Gizi</h1>
                    <div class="mt-2 flex items-center gap-3 no-print text-[11px] font-bold text-slate-500 uppercase tracking-widest">
                        <span id="status-badge" class="bg-emerald-600 text-white px-2 py-0.5 rounded-md italic">Trial Mode</span>
                        <span id="trial-info">Memuat...</span>
                    </div>
                </div>
                <div class="flex gap-3 no-print">
                    <button onclick="window.saveHistory()" class="px-6 py-3 bg-emerald-600 hover:bg-emerald-700 text-white rounded-2xl font-bold text-sm shadow-lg shadow-emerald-100 flex items-center gap-2 transition-all"><i class="fas fa-save"></i> Simpan</button>
                    <button onclick="window.print()" class="px-6 py-3 bg-white border border-slate-200 text-slate-700 rounded-2xl font-bold text-sm hover:bg-slate-50 flex items-center gap-2"><i class="fas fa-print"></i> Cetak</button>
                </div>
            </div>

            <div class="dashboard-card p-6 mb-8">
                <div class="flex flex-wrap justify-between items-center gap-4 mb-6">
                    <div class="flex items-center gap-4">
                        <div class="bg-emerald-50 p-3 rounded-2xl text-emerald-600"><i class="fas fa-bullseye"></i></div>
                        <div>
                            <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Target Kelompok</p>
                            <select id="targetStatus" onchange="window.hitungSemua()" class="font-bold text-slate-800 bg-transparent outline-none cursor-pointer">
                                <option value="BALITA">BALITA (1350 kkal)</option>
                                <option value="PAUD">PAUD/TK (1400 kkal)</option>
                                <option value="SD123">SD Kelas 1-3 (1650 kkal)</option>
                                <option value="SD456">SD Kelas 4-6 (1950 kkal)</option>
                                <option value="SMP">SMP/MTS (2225 kkal)</option>
                                <option value="SMA">SMA/SMK (2375 kkal)</option>
                            </select>
                        </div>
                    </div>
                    <button onclick="window.tambahBaris()" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl text-xs font-bold transition-all"><i class="fas fa-plus text-emerald-600 mr-1"></i> Tambah Bahan</button>
                </div>

                <div class="overflow-x-auto">
                    <table class="gizi-table">
                        <thead>
                            <tr class="text-left">
                                <th>Bahan Makanan</th>
                                <th style="width:100px">Berat(g)</th>
                                <th>Energi</th><th>Prot</th><th>Lmk</th><th>Krb</th>
                                <th class="no-print"></th>
                            </tr>
                        </thead>
                        <tbody id="badanTabel"></tbody>
                    </table>
                </div>
            </div>

            <div class="grid lg:grid-cols-4 gap-6">
                <div class="lg:col-span-3 grid grid-cols-2 md:grid-cols-4 gap-4">
                    <div class="stat-box border-b-4 border-orange-400">
                        <p class="text-[10px] font-black text-slate-400 uppercase">Energi</p>
                        <p class="text-2xl font-black text-slate-800"><span id="rep-energi">0</span> <small class="text-xs text-slate-400">kcal</small></p>
                        <div class="w-full bg-slate-100 h-1.5 rounded-full mt-3 overflow-hidden">
                            <div id="bar-energi" class="bg-orange-400 h-full transition-all duration-500" style="width: 0%"></div>
                        </div>
                    </div>
                    <div class="stat-box border-b-4 border-blue-400">
                        <p class="text-[10px] font-black text-slate-400 uppercase">Protein</p>
                        <p class="text-2xl font-black text-slate-800"><span id="rep-protein">0</span> <small class="text-xs text-slate-400">g</small></p>
                        <div class="w-full bg-slate-100 h-1.5 rounded-full mt-3 overflow-hidden">
                            <div id="bar-protein" class="bg-blue-400 h-full transition-all duration-500" style="width: 0%"></div>
                        </div>
                    </div>
                    <div class="stat-box border-b-4 border-yellow-400">
                        <p class="text-[10px] font-black text-slate-400 uppercase">Lemak</p>
                        <p class="text-2xl font-black text-slate-800"><span id="rep-lemak">0</span> <small class="text-xs text-slate-400">g</small></p>
                    </div>
                    <div class="stat-box border-b-4 border-emerald-400">
                        <p class="text-[10px] font-black text-slate-400 uppercase">Karbo</p>
                        <p class="text-2xl font-black text-slate-800"><span id="rep-karbo">0</span> <small class="text-xs text-slate-400">g</small></p>
                    </div>
                </div>
                <div id="recom-box" class="dashboard-card bg-slate-900 p-6 text-white hidden">
                    <h4 class="font-bold text-emerald-400 text-[10px] uppercase tracking-widest mb-4 flex items-center gap-2"><i class="fas fa-lightbulb"></i> Analisis AI</h4>
                    <ul id="recom-list" class="text-xs space-y-3 text-slate-300"></ul>
                </div>
            </div>
        </div>

        <div id="section-riwayat" class="hidden max-w-6xl mx-auto">
            <h1 class="text-3xl font-black text-slate-900 mb-8">Riwayat Analisis</h1>
            <div class="dashboard-card overflow-hidden">
                <table class="w-full text-left">
                    <thead class="bg-slate-50 border-b border-slate-100">
                        <tr>
                            <th class="p-6 text-[10px] font-black text-slate-400 uppercase">Tanggal</th>
                            <th class="p-6 text-[10px] font-black text-slate-400 uppercase">Target</th>
                            <th class="p-6 text-[10px] font-black text-slate-400 uppercase">Total Kalori</th>
                            <th class="p-6 text-center text-[10px] font-black text-slate-400 uppercase">Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="riwayat-body"></tbody>
                </table>
            </div>
        </div>

        <div id="section-profil" class="hidden max-w-xl mx-auto">
            <h1 class="text-3xl font-black text-slate-900 mb-8">Pengaturan Akun</h1>
            <div class="dashboard-card p-10">
                <div class="space-y-6">
                    <div>
                        <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2 block">Nama Pengguna</label>
                        <input type="text" id="prof-nama" class="table-input py-4 font-bold text-lg">
                        <button onclick="window.updateNama()" class="mt-3 w-full py-3 bg-emerald-600 text-white rounded-xl font-bold text-xs uppercase">Update Nama</button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <datalist id="daftarBahan"></datalist>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut, updatePassword, updateProfile } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, collection, query, where, getDocs, limit, addDoc, serverTimestamp, deleteDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCaaCF_CQMftYWePC51dUWMRzndkZ-CW6o",
            authDomain: "nutricalc-20eb4.firebaseapp.com",
            projectId: "nutricalc-20eb4",
            storageBucket: "nutricalc-20eb4.firebasestorage.app",
            messagingSenderId: "361370382525",
            appId: "1:361370382525:web:c11112ece7454b81a487d4"
        };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const targetAKG = { 
            "BALITA": { kal: 337.5, prot: 5, lemak: 11.25, karbo: 50, h_kal: 1350, h_prot: 20 }, 
            "PAUD": { kal: 350, prot: 6.25, lemak: 12.5, karbo: 55, h_kal: 1400, h_prot: 25 }, 
            "SD123": { kal: 495, prot: 12, lemak: 16.5, karbo: 75, h_kal: 1650, h_prot: 40 }, 
            "SD456": { kal: 585, prot: 15.75, lemak: 19.5, karbo: 87, h_kal: 1950, h_prot: 52.5 }, 
            "SMP": { kal: 667.5, prot: 20.25, lemak: 22.5, karbo: 97.5, h_kal: 2225, h_prot: 67.5 }, 
            "SMA": { kal: 712.5, prot: 21, lemak: 23.25, karbo: 105, h_kal: 2375, h_prot: 70 }
        };

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                const userDoc = await getDoc(doc(db, "users", user.uid));
                if (userDoc.exists()) {
                    const data = userDoc.data();
                    document.querySelectorAll('#user-display-name').forEach(el => el.innerText = data.nama.split(' ')[0]);
                    document.getElementById('prof-nama').value = data.nama;
                    const diff = data.trialExpired - Date.now();
                    document.getElementById('trial-info').innerText = diff > 0 ? `${Math.ceil(diff/(1000*60*60*24))} Hari Lagi` : "Habis";
                }
            } else { window.location.href = "login.html"; }
        });

        window.tambahBaris = () => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td><input type="text" list="daftarBahan" oninput="window.cariDatabase(this); window.autoFillGizi(this)" class="table-input in-nama font-bold text-slate-700" placeholder="Cari..."></td>
                <td><input type="number" class="table-input in-gram font-bold" value="0" oninput="window.autoFillGizi(this.closest('tr').querySelector('.in-nama'))"></td>
                <td><input type="number" class="table-input v-energi bg-transparent border-none text-center" value="0" readonly></td>
                <td><input type="number" class="table-input v-protein bg-transparent border-none text-center" value="0" readonly></td>
                <td><input type="number" class="table-input v-lemak bg-transparent border-none text-center" value="0" readonly></td>
                <td><input type="number" class="table-input v-karbo bg-transparent border-none text-center" value="0" readonly></td>
                <td class="no-print text-center"><button onclick="this.parentElement.parentElement.remove();window.hitungSemua()" class="text-slate-300 hover:text-red-500"><i class="fas fa-trash"></i></button></td>
            `;
            document.getElementById('badanTabel').appendChild(tr);
        };

        window.autoFillGizi = (input) => {
            if (!input) return;
            const row = input.closest('tr');
            const selectedValue = row.querySelector('.in-nama').value;
            const gram = parseFloat(row.querySelector('.in-gram').value) || 0;
            
            const selectedOption = Array.from(document.getElementById('daftarBahan').options).find(o => o.value === selectedValue);
            
            if (selectedOption && selectedOption.dataset.gizi) {
                const data = JSON.parse(selectedOption.dataset.gizi);
                // Hitung nilai gizi berdasarkan berat per 100g (sesuai standar Tabel Komposisi Pangan)
                // Jika database kamu menyimpan per 1g, hilangkan pembagi /100
                row.querySelector('.v-energi').value = ((data.energi || 0) * (gram / 100)).toFixed(2);
                row.querySelector('.v-protein').value = ((data.protein || 0) * (gram / 100)).toFixed(2);
                row.querySelector('.v-lemak').value = ((data.lemak || 0) * (gram / 100)).toFixed(2);
                row.querySelector('.v-karbo').value = ((data.karbo || 0) * (gram / 100)).toFixed(2);
                window.hitungSemua();
            }
        };

        window.hitungSemua = () => {
            const fields = ['energi', 'protein', 'lemak', 'karbo'];
            let total = { energi: 0, protein: 0, lemak: 0, karbo: 0 };
            
            document.querySelectorAll('#badanTabel tr').forEach(row => { 
                fields.forEach(f => {
                    total[f] += parseFloat(row.querySelector(`.v-${f}`).value) || 0;
                });
            });
            
            const targetKey = document.getElementById('targetStatus').value;
            const target = targetAKG[targetKey];
            
            fields.forEach(f => {
                const el = document.getElementById(`rep-${f}`);
                if (el) el.innerText = total[f].toFixed(1);
            });
            
            const pE = Math.min((total.energi / target.h_kal) * 100, 100);
            const pP = Math.min((total.protein / target.h_prot) * 100, 100);
            document.getElementById('bar-energi').style.width = pE + '%';
            document.getElementById('bar-protein').style.width = pP + '%';

            const list = document.getElementById('recom-list'); list.innerHTML = "";
            if(total.energi < target.kal) {
                const kurang = (target.kal - total.energi).toFixed(0);
                list.innerHTML += `<li class="flex gap-2"><i class="fas fa-info-circle text-emerald-400"></i><span>Kurang ${kurang} kcal. Coba tambah porsi karbohidrat.</span></li>`;
            }
            document.getElementById('recom-box').classList.toggle('hidden', list.innerHTML === "");
        };

        window.cariDatabase = async (input) => {
            const keyword = input.value.trim().toLowerCase();
            if (keyword.length < 3) return;
            const q = query(collection(db, "food_database"), where("nama_search", ">=", keyword), where("nama_search", "<=", keyword + "\uf8ff"), limit(8));
            const snap = await getDocs(q);
            const list = document.getElementById('daftarBahan'); list.innerHTML = "";
            snap.forEach(d => {
                let opt = document.createElement('option');
                opt.value = d.data().nama;
                opt.dataset.gizi = JSON.stringify(d.data());
                list.appendChild(opt);
            });
        };

        window.switchTab = (tab) => {
            ['section-kalkulator', 'section-riwayat', 'section-profil'].forEach(s => document.getElementById(s).classList.add('hidden'));
            ['menu-kalkulator', 'menu-riwayat', 'menu-profil'].forEach(m => document.getElementById(m).classList.remove('nav-active', 'font-bold'));
            document.getElementById(`section-${tab}`).classList.remove('hidden');
            document.getElementById(`menu-${tab}`).classList.add('nav-active', 'font-bold');
        };

        window.logout = () => signOut(auth).then(() => window.location.href="login.html");
        window.tambahBaris();
    </script>
</body>
</html>
