<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masuk & Daftar | NutriCalc Profesional</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .hidden-form { display: none; }
        .divider { display: flex; align-items: center; text-align: center; color: #cbd5e1; font-size: 0.7rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.1em; margin: 1.5rem 0; }
        .divider::before, .divider::after { content: ""; flex: 1; border-bottom: 1px solid #f1f5f9; }
        .divider:not(:empty)::before { margin-right: 1rem; }
        .divider:not(:empty)::after { margin-left: 1rem; }
        input:focus { border-color: #10b981 !important; box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.1); }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full bg-white rounded-[2.5rem] shadow-2xl shadow-emerald-100 border border-slate-100 overflow-hidden my-8">
        
        <div class="bg-emerald-600 p-8 text-center text-white relative">
            <h2 class="text-2xl font-extrabold tracking-tight flex items-center justify-center gap-2">
                <svg width="24" height="24" viewBox="0 0 40 40" fill="none"><rect width="40" height="40" rx="10" fill="white"/><path d="M20 10V30M10 20H30" stroke="#10b981" stroke-width="4" stroke-linecap="round"/></svg>
                NutriCalc
            </h2>
            <p id="form-subtitle" class="text-emerald-100 text-xs mt-2 font-medium">Silakan masuk ke akun Anda.</p>
        </div>

        <div class="p-8">
            <button id="google-login-btn" class="w-full flex items-center justify-center gap-3 py-3.5 bg-white border border-slate-200 rounded-2xl font-bold text-slate-700 hover:bg-slate-50 transition-all text-sm shadow-sm">
                <svg width="18" height="18" viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
                Lanjutkan dengan Google
            </button>

            <div class="divider">Atau gunakan email</div>

            <form id="login-form" class="space-y-4">
                <div>
                    <label class="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2">Email</label>
                    <input type="email" id="login-email" required class="w-full px-5 py-3.5 bg-slate-50 border border-slate-100 rounded-2xl outline-none text-sm font-medium">
                </div>
                <div>
                    <label class="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2">Password</label>
                    <div class="relative">
                        <input type="password" id="login-password" required class="w-full px-5 py-3.5 bg-slate-50 border border-slate-100 rounded-2xl outline-none text-sm font-medium">
                        <button type="button" onclick="window.togglePassword('login-password')" class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-300 hover:text-emerald-500 transition-colors">
                            <svg id="eye-icon-login-password" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
                        </button>
                    </div>
                </div>
                <label class="flex items-start gap-3 cursor-pointer group pt-2">
                    <input type="checkbox" required class="mt-1 h-4 w-4 rounded border-slate-300 text-emerald-600 focus:ring-emerald-500">
                    <span class="text-[11px] text-slate-500 leading-tight">Saya setuju dengan <a href="help.html#syarat" class="text-emerald-600 font-bold hover:underline">Syarat & Ketentuan</a> dan <a href="help.html#kebijakan" class="text-emerald-600 font-bold hover:underline">Kebijakan Privasi</a> *</span>
                </label>
                <button type="submit" class="w-full py-4 bg-emerald-600 text-white rounded-2xl font-bold shadow-lg shadow-emerald-100 hover:bg-emerald-700 transition-all">Masuk Sekarang</button>
            </form>

            <form id="register-form" class="space-y-4 hidden-form">
                <div>
                    <label class="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2">Nama Lengkap</label>
                    <input type="text" id="reg-name" required class="w-full px-5 py-3.5 bg-slate-50 border border-slate-100 rounded-2xl outline-none text-sm font-medium">
                </div>
                <div>
                    <label class="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2">Email</label>
                    <input type="email" id="reg-email" required class="w-full px-5 py-3.5 bg-slate-50 border border-slate-100 rounded-2xl outline-none text-sm font-medium">
                </div>
                <div>
                    <label class="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2">Nomor HP *</label>
                    <input type="tel" id="reg-phone" required class="w-full px-5 py-3.5 bg-slate-50 border border-slate-100 rounded-2xl outline-none text-sm font-medium">
                    <p class="text-[9px] text-slate-400 mt-1 font-medium italic">Nomor HP akan digunakan untuk keperluan akun</p>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2">Kata Sandi</label>
                        <div class="relative">
                            <input type="password" id="reg-password" required class="w-full px-5 py-3.5 bg-slate-50 border border-slate-100 rounded-2xl outline-none text-sm font-medium">
                            <button type="button" onclick="window.togglePassword('reg-password')" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-300 hover:text-emerald-500">
                                <svg id="eye-icon-reg-password" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
                            </button>
                        </div>
                        <p class="text-[9px] text-slate-400 mt-1 font-medium">Minimal 8 karakter</p>
                    </div>
                    <div>
                        <label class="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2">Konfirmasi Sandi</label>
                        <div class="relative">
                            <input type="password" id="reg-confirm" required class="w-full px-5 py-3.5 bg-slate-50 border border-slate-100 rounded-2xl outline-none text-sm font-medium">
                            <button type="button" onclick="window.togglePassword('reg-confirm')" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-300 hover:text-emerald-500">
                                <svg id="eye-icon-reg-confirm" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
                            </button>
                        </div>
                    </div>
                </div>
                <label class="flex items-start gap-3 cursor-pointer group pt-2">
                    <input type="checkbox" required class="mt-1 h-4 w-4 rounded border-slate-300 text-emerald-600 focus:ring-emerald-500">
                    <span class="text-[11px] text-slate-500 leading-tight">Saya setuju dengan <a href="help.html#syarat" class="text-emerald-600 font-bold hover:underline">Syarat & Ketentuan</a> dan <a href="help.html#kebijakan" class="text-emerald-600 font-bold hover:underline">Kebijakan Privasi</a> *</span>
                </label>
                <button type="submit" class="w-full py-4 bg-slate-900 text-white rounded-2xl font-bold shadow-lg hover:bg-black transition-all">Daftar & Mulai Trial</button>
            </form>

            <div class="mt-8 pt-6 border-t border-slate-50 text-center">
                <p id="switch-text" class="text-xs font-bold text-slate-400 uppercase tracking-widest">
                    Belum punya akun? <button type="button" onclick="window.toggleForm()" class="text-emerald-600 hover:underline ml-1">Daftar Gratis</button>
                </p>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCaaCF_CQMftYWePC51dUWMRzndkZ-CW6o",
            authDomain: "nutricalc-20eb4.firebaseapp.com",
            projectId: "nutricalc-20eb4",
            storageBucket: "nutricalc-20eb4.firebasestorage.app",
            messagingSenderId: "361370382525",
            appId: "1:361370382525:web:c11112ece7454b81a487d4"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        // --- Fungsi Toggle Lihat Password ---
        window.togglePassword = (id) => {
            const input = document.getElementById(id);
            const icon = document.getElementById('eye-icon-' + id);
            if (input.type === 'password') {
                input.type = 'text';
                icon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l18 18" />';
            } else {
                input.type = 'password';
                icon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>';
            }
        };

        // --- Fungsi Switch Form Login/Daftar ---
        window.toggleForm = () => {
            const login = document.getElementById('login-form');
            const reg = document.getElementById('register-form');
            const sub = document.getElementById('form-subtitle');
            const btn = document.getElementById('switch-text');
            login.classList.toggle('hidden-form');
            reg.classList.toggle('hidden-form');
            const isReg = login.classList.contains('hidden-form');
            sub.innerText = isReg ? "Daftar untuk akses gizi profesional." : "Silakan masuk ke akun Anda.";
            btn.innerHTML = isReg ? 'Sudah punya akun? <button type="button" onclick="window.toggleForm()" class="text-emerald-600 hover:underline ml-1">Masuk di sini</button>' : 'Belum punya akun? <button type="button" onclick="window.toggleForm()" class="text-emerald-600 hover:underline ml-1">Daftar Gratis</button>';
        };

        // --- Logic Pendaftaran ---
        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const pass = document.getElementById('reg-password').value;
            const confirm = document.getElementById('reg-confirm').value;
            
            if(pass !== confirm) {
                return alert("Ups! Kata sandi konfirmasi tidak sama. Silakan periksa kembali.");
            }
            if(pass.length < 8) {
                return alert("Kata sandi terlalu pendek. Gunakan minimal 8 karakter.");
            }

            try {
                const userCred = await createUserWithEmailAndPassword(auth, document.getElementById('reg-email').value, pass);
                await setDoc(doc(db, "users", userCred.user.uid), {
                    nama: document.getElementById('reg-name').value,
                    email: userCred.user.email,
                    phone: document.getElementById('reg-phone').value,
                    status: "Trial",
                    tanggalDaftar: serverTimestamp(),
                    trialExpired: Date.now() + (3 * 24 * 60 * 60 * 1000)
                });
                window.location.href = "dashboard.html";
            } catch (err) { alert("Pendaftaran Gagal: " + err.message); }
        });

        // --- Logic Masuk (Login) ---
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            try {
                await signInWithEmailAndPassword(auth, document.getElementById('login-email').value, document.getElementById('login-password').value);
                window.location.href = "dashboard.html";
            } catch (err) { alert("Gagal Masuk: Email atau Password salah."); }
        });

        // --- Logic Google Login ---
        document.getElementById('google-login-btn').addEventListener('click', async () => {
            try {
                const result = await signInWithPopup(auth, provider);
                const userDoc = await getDoc(doc(db, "users", result.user.uid));
                if (!userDoc.exists()) {
                    await setDoc(doc(db, "users", result.user.uid), {
                        nama: result.user.displayName, email: result.user.email,
                        status: "Trial", tanggalDaftar: serverTimestamp(),
                        trialExpired: Date.now() + (3 * 24 * 60 * 60 * 1000)
                    });
                }
                window.location.href = "dashboard.html";
            } catch (err) { alert("Login Google Gagal: " + err.message); }
        });
    </script>
</body>
</html>
