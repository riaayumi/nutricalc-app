<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masuk & Daftar | NutriCalc Profesional</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .hidden-form { display: none; }
        .divider { display: flex; items-center: center; text-align: center; color: #cbd5e1; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; margin: 1.5rem 0; }
        .divider::before, .divider::after { content: ""; flex: 1; border-bottom: 1px solid #f1f5f9; }
        .divider:not(:empty)::before { margin-right: 1rem; }
        .divider:not(:empty)::after { margin-left: 1rem; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-6">

    <div class="max-w-md w-full bg-white rounded-[2.5rem] shadow-2xl shadow-emerald-100 border border-slate-100 overflow-hidden">
        
        <div class="bg-emerald-600 p-10 text-center text-white relative">
            <div class="absolute top-0 left-1/2 -translate-x-1/2 w-20 h-1 bg-white/20 rounded-b-full"></div>
            <h2 class="text-3xl font-bold tracking-tight text-white flex items-center justify-center gap-2">
                <svg width="28" height="28" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect width="40" height="40" rx="10" fill="white"/>
                    <path d="M20 10V30M10 20H30" stroke="#10b981" stroke-width="4" stroke-linecap="round"/>
                </svg>
                NutriCalc
            </h2>
            <p id="form-subtitle" class="text-emerald-100 text-sm mt-3 font-medium opacity-90">Silakan masuk ke akun Anda.</p>
        </div>

        <div class="p-10">
            <button id="google-login-btn" class="w-full flex items-center justify-center gap-3 py-4 bg-white border border-slate-200 rounded-2xl font-bold text-slate-700 hover:bg-slate-50 hover:border-slate-300 transition-all shadow-sm">
                <svg width="20" height="20" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                    <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                    <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                    <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
                </svg>
                Lanjutkan dengan Google
            </button>

            <div class="divider">Atau gunakan email</div>

            <form id="login-form" class="space-y-5">
                <div>
                    <label class="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-3">Email</label>
                    <input type="email" id="login-email" required placeholder="nama@email.com" class="w-full px-6 py-4 bg-slate-50 border border-slate-100 rounded-2xl focus:outline-none focus:border-emerald-500 transition-all text-sm font-medium">
                </div>
                <div>
                    <label class="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-3">Password</label>
                    <div class="relative">
                        <input type="password" id="login-password" required placeholder="••••••••" class="w-full px-6 py-4 bg-slate-50 border border-slate-100 rounded-2xl focus:outline-none focus:border-emerald-500 transition-all text-sm font-medium">
                        <button type="button" onclick="window.togglePassword('login-password')" class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400">
                            <svg id="eye-icon-login-password" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
                        </button>
                    </div>
                </div>
                <button type="submit" class="w-full py-4 bg-emerald-600 text-white rounded-2xl font-bold shadow-lg shadow-emerald-100 hover:bg-emerald-700 transition-all">
                    Masuk Sekarang
                </button>
            </form>

            <form id="register-form" class="space-y-5 hidden-form">
                <div>
                    <label class="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-3">Nama Lengkap</label>
                    <input type="text" id="reg-name" required placeholder="Nama Anda" class="w-full px-6 py-4 bg-slate-50 border border-slate-100 rounded-2xl focus:outline-none focus:border-emerald-500 text-sm">
                </div>
                <div>
                    <label class="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-3">Email</label>
                    <input type="email" id="reg-email" required placeholder="nama@email.com" class="w-full px-6 py-4 bg-slate-50 border border-slate-100 rounded-2xl focus:outline-none focus:border-emerald-500 text-sm">
                </div>
                <div>
                    <label class="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-3">Password</label>
                    <div class="relative">
                        <input type="password" id="reg-password" required placeholder="Min. 8 Karakter" class="w-full px-6 py-4 bg-slate-50 border border-slate-100 rounded-2xl focus:outline-none focus:border-emerald-500 text-sm">
                        <button type="button" onclick="window.togglePassword('reg-password')" class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400">
                            <svg id="eye-icon-reg-password" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
                        </button>
                    </div>
                </div>
                <button type="submit" class="w-full py-4 bg-slate-900 text-white rounded-2xl font-bold shadow-lg hover:bg-black transition-all">
                    Daftar & Mulai Trial
                </button>
            </form>

            <div class="mt-8 pt-6 border-t border-slate-50 text-center">
                <p id="switch-text" class="text-xs font-bold text-slate-400 uppercase tracking-widest">
                    Belum punya akun? 
                    <button type="button" onclick="window.toggleForm()" class="text-emerald-600 hover:underline ml-1">Daftar Gratis</button>
                </p>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCaaCF_CQMftYWePC51dUWMRzndkZ-CW6o",
            authDomain: "nutricalc-20eb4.firebaseapp.com",
            projectId: "nutricalc-20eb4",
            storageBucket: "nutricalc-20eb4.firebasestorage.app",
            messagingSenderId: "361370382525",
            appId: "1:361370382525:web:c11112ece7454b81a487d4"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        // --- GOOGLE SIGN IN ---
        document.getElementById('google-login-btn').addEventListener('click', async () => {
            try {
                const result = await signInWithPopup(auth, provider);
                const user = result.user;
                
                // Cek apakah user sudah ada di Firestore
                const userDoc = await getDoc(doc(db, "users", user.uid));
                
                if (!userDoc.exists()) {
                    // Jika user baru (pertama kali login Google), buat data trial
                    await setDoc(doc(db, "users", user.uid), {
                        nama: user.displayName,
                        email: user.email,
                        status: "Trial",
                        tanggalDaftar: serverTimestamp(),
                        trialExpired: Date.now() + (3 * 24 * 60 * 60 * 1000)
                    });
                }
                window.location.href = "dashboard.html";
            } catch (error) {
                alert("Google Login Error: " + error.message);
            }
        });

        // --- FUNGSI PASSWORD ---
        window.togglePassword = (id) => {
            const input = document.getElementById(id);
            input.type = input.type === "password" ? "text" : "password";
        };

        // --- FUNGSI TOGGLE ---
        window.toggleForm = () => {
            const loginForm = document.getElementById('login-form');
            const registerForm = document.getElementById('register-form');
            const subtitle = document.getElementById('form-subtitle');
            loginForm.classList.toggle('hidden-form');
            registerForm.classList.toggle('hidden-form');
            subtitle.innerText = loginForm.classList.contains('hidden-form') ? "Daftar untuk akses gizi profesional." : "Silakan masuk ke akun Anda.";
        };

        // Handle Email Register & Login (Tetap sama seperti sebelumnya)
        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('reg-name').value;
            const email = document.getElementById('reg-email').value;
            const password = document.getElementById('reg-password').value;
            try {
                const userCred = await createUserWithEmailAndPassword(auth, email, password);
                await setDoc(doc(db, "users", userCred.user.uid), {
                    nama: name, email: email, status: "Trial", tanggalDaftar: serverTimestamp(),
                    trialExpired: Date.now() + (3 * 24 * 60 * 60 * 1000)
                });
                window.location.href = "dashboard.html";
            } catch (err) { alert(err.message); }
        });

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;
            try {
                await signInWithEmailAndPassword(auth, email, password);
                window.location.href = "dashboard.html";
            } catch (err) { alert(err.message); }
        });
    </script>
</body>
</html>
